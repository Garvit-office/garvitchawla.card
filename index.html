<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garvit Chawla</title>

<style>
:root{
  --glass: rgba(255,255,255,0.18);
  --border: rgba(255,255,255,0.35);
  --glow: rgba(124,58,237,0.5);
}

body{
  margin:0;
  height:100vh;
  font-family:'Inter',sans-serif;
  background: linear-gradient(135deg,#eef2ff,#f8fafc);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* SPLASH */
.splash{
  position:fixed;
  inset:0;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:10;
  animation:fadeOut 1s ease 2s forwards;
}

.splash h1{
  font-size:40px;
  letter-spacing:3px;
  animation:pop 1.2s ease;
}

@keyframes pop{
  from{transform:scale(0.6);opacity:0}
  to{transform:scale(1);opacity:1}
}
@keyframes fadeOut{
  to{opacity:0;visibility:hidden}
}

/* CARD */
.scene{
  perspective:1400px;
}

.card{
  width:340px;
  height:215px;
  border-radius:24px;
  transform-style:preserve-3d;
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
  position:relative;
  animation:floatCard 4s ease-in-out infinite;
}

@keyframes floatCard{
  0%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
  100%{transform:translateY(0)}
}

.side{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:24px;
  backdrop-filter:blur(30px);
  background:var(--glass);
  border:1px solid var(--border);
  box-shadow:
    0 30px 100px rgba(0,0,0,0.18),
    inset 0 0 40px rgba(255,255,255,0.25);
  padding:20px;
  backface-visibility:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.card.is-flipped{
  transform:rotateY(180deg);
}

/* BACK */
.back{
  transform:rotateY(180deg);
  background:linear-gradient(180deg,#071124,#0b1626);
  color:#fff;
}

/* TEXT */
.name{
  font-size:20px;
  font-weight:700;
}
.role{
  font-size:13px;
  color:#555;
  letter-spacing:1px;
}

/* BUTTON */
.flip-btn{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 14px;
  border-radius:12px;
  backdrop-filter:blur(10px);
  background:rgba(255,255,255,0.2);
  border:1px solid rgba(255,255,255,0.3);
  font-size:13px;
}

/* MOBILE HINT */
.mobile-hint{
  position:absolute;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.6);
  color:#fff;
  padding:10px 14px;
  border-radius:10px;
  font-size:13px;
  opacity:0;
  transition:0.3s;
}
.mobile-hint.show{opacity:1}
</style>
</head>

<body>

<div class="splash">
  <h1>GARVIT CHAWLA</h1>
</div>

<div class="scene">
  <div class="card" id="card">

    <!-- FRONT -->
    <div class="side front">
      <h2 class="name">Garvit Chawla</h2>
      <p class="role">Full Stack Developer</p>

      <button class="flip-btn" id="flipBtn">Flip</button>
    </div>

    <!-- BACK -->
    <div class="side back">
      <h3>Garvit Chawla</h3>
      <p>Full Stack Developer</p>
      <p>📧 garvitchawla.office@gmail.com</p>
      <p>📞 +91 9660665666</p>
      <p>🔗 github.com/garvit0080</p>
    </div>

    <div class="mobile-hint" id="hint">
      Swipe / Tap to interact
    </div>

  </div>
</div>

<script>
const card = document.getElementById("card");
let currentRotX = 0, currentRotY = 0;

/* UPDATE TRANSFORM */
function update(){
  const flip = card.classList.contains("is-flipped") ? "rotateY(180deg)" : "";
  card.style.transform = `${flip} rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
}

/* TAP TILT */
document.addEventListener("click", e=>{
  const rect = card.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const cx = rect.width/2;
  const cy = rect.height/2;

  currentRotY = (x-cx)/cx*10;
  currentRotX = (cy-y)/cy*10;
  update();

  setTimeout(()=>{
    currentRotX=0;
    currentRotY=0;
    update();
  },700);
});

/* DRAG ROTATE */
let startX,startY,isDown=false;

document.addEventListener("mousedown",e=>{
  isDown=true;
  startX=e.clientX;
  startY=e.clientY;
});

document.addEventListener("mousemove",e=>{
  if(!isDown) return;
  currentRotY += (e.clientX-startX)*0.05;
  currentRotX -= (e.clientY-startY)*0.05;
  startX=e.clientX;
  startY=e.clientY;
  update();
});

document.addEventListener("mouseup",()=>{
  isDown=false;
  currentRotX*=0.4;
  currentRotY*=0.4;
  update();

  setTimeout(()=>{
    currentRotX=0;
    currentRotY=0;
    update();
  },300);
});

/* SWIPE FLIP */
let swipeStart=0;

document.addEventListener("touchstart",e=>{
  swipeStart=e.touches[0].clientX;
});

document.addEventListener("touchend",e=>{
  let diff=e.changedTouches[0].clientX-swipeStart;
  if(Math.abs(diff)>80){
    card.classList.toggle("is-flipped");
    update();
    navigator.vibrate && navigator.vibrate(15);
  }
});

/* BUTTON FLIP */
document.getElementById("flipBtn").onclick=()=>{
  card.classList.toggle("is-flipped");
  update();
  navigator.vibrate && navigator.vibrate(10);
};

/* HINT */
const hint=document.getElementById("hint");
if(!localStorage.getItem("seen")){
  setTimeout(()=>hint.classList.add("show"),500);
  setTimeout(()=>hint.classList.remove("show"),4000);
  localStorage.setItem("seen","1");
}
</script>

</body>
</html>
