<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garvit Chawla Card</title>

<style>
:root {
  --bg1: #eef2ff;
  --bg2: #f8fafc;
  --glass: rgba(255,255,255,0.15);
  --border: rgba(255,255,255,0.25);
  --glow: rgba(124,58,237,0.5);
  --accent: #06b6d4; /* portfolio accent (sky/cyan) */
  --accent-opaque: rgba(6,182,212,0.06);
  --text-main: #0f172a;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, var(--bg1), var(--bg2));
  font-family: 'Inter', sans-serif;
  overflow: hidden;
  color: var(--text-main);
}

body.dark {
  --bg1: #0b1020;
  --bg2: #111827;
  --glass: rgba(20,28,45,0.6);
  --border: rgba(148,163,184,0.25);
  --glow: rgba(56,189,248,0.45);
  --text-main: #e5e7eb;
}

/* SPLASH */
.splash {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
  animation: fadeOut 1s ease 2.2s forwards;
}

.splash h1 {
  font-size: 42px;
  letter-spacing: 3px;
  animation: pop 1.2s ease;
}

@keyframes pop {
  from {transform: scale(0.6); opacity:0;}
  to {transform: scale(1); opacity:1;}
}

@keyframes fadeOut {
  to {opacity:0; visibility:hidden;}
}

/* SCENE */
.scene {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  perspective: 1400px;
  padding: 20px;
  box-sizing: border-box;
}

/* CARD */
.card {
  width: 330px;
  height: 210px;
  -webkit-transform-style: preserve-3d;
  transform-style: preserve-3d;
  transition: transform 280ms cubic-bezier(.2,.8,.2,1);
  touch-action: none;
  position: relative;
  transform-origin: center center;
}

/* SIDES */
.side {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 22px;
  backdrop-filter: blur(25px);
  background: var(--glass);
  border: 1px solid var(--border);
  box-shadow:
    0 25px 80px rgba(0,0,0,0.15),
    inset 0 0 30px rgba(255,255,255,0.2);
  padding: 20px;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* flipped state (works on both desktop and touch) */
.card.is-flipped {
  transform: rotateY(180deg);
}

/* BACK */
.back {
  transform: rotateY(180deg);
  /* white-style back */
  background: #ffffff;
  color: var(--text-main);
  align-items: center;
  border: 1px solid rgba(15,23,42,0.06);
  box-shadow: 0 12px 36px rgba(12,20,30,0.06);
}

.back-inner{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative}
.back-pattern{position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,0.02) 0 6px, rgba(255,255,255,0.00) 6px 12px);opacity:0.04;border-radius:22px}
.back-content{position:relative;padding:18px;border-radius:14px;background:#fff;border:1px solid var(--accent-opaque);width:100%;height:100%;box-sizing:border-box;text-align:center}
.contact-card{display:flex;flex-direction:column;gap:6px;color:var(--text-main);font-size:12.5px;margin-top:6px}
body.dark .back-content{background:#ffffff; color:var(--text-main)}

/* SIGNATURE */
.signature {
  filter: drop-shadow(0 4px 8px var(--glow));
}

/* FRONT centering and shine */
.front{justify-content:center;align-items:center}
.center-block{display:flex;flex-direction:column;align-items:center;gap:10px}
.signature{stroke:#000000}

/* stroke overlay for draw/erase animation (keeps filled signature underneath) */
.signature-stroke{fill:none;stroke:#001f54;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;stroke-dasharray:var(--pathLen);stroke-dashoffset:var(--pathLen);}
.signature-stroke.animate{animation:drawErase 3200ms ease-in-out infinite}

@keyframes drawErase{
  0%{stroke-dashoffset:var(--pathLen);opacity:1}
  45%{stroke-dashoffset:0;opacity:1}
  55%{stroke-dashoffset:0;opacity:1}
  100%{stroke-dashoffset:calc(var(--pathLen) * -1);opacity:0}
}
/* soft pulsing glow around the ink */
.glow-overlay{stroke:#7ea7ff;stroke-width:6;opacity:0.12;filter:blur(6px);mix-blend-mode:screen;pointer-events:none;transform-origin:center}
@keyframes pulse {0%{opacity:0.06;transform:scale(1)}50%{opacity:0.18;transform:scale(1.02)}100%{opacity:0.06;transform:scale(1)}}
.glow-overlay.animate{animation:pulse 2.6s ease-in-out infinite}

/* subtle mirrored reflection */
.reflection{transform:scaleY(-1);opacity:0.08;filter:blur(3px) saturate(0.8);margin-top:8px}
@keyframes reflectPulse {0%{opacity:0.06}50%{opacity:0.14}100%{opacity:0.06}}
.reflection.animate{animation:reflectPulse 2.6s ease-in-out infinite}

/* TEXT */
.name {
  font-size: 18px;
  font-weight: 600;
}

.role {
  font-size: 13px;
  color: #444;
}

.contact {
  font-size: 12px;
  line-height: 1.6;
}

/* GLOW EFFECT */
.card::after {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 22px;
  background: radial-gradient(circle, var(--glow), transparent 70%);
  opacity: 0.15;
  z-index: -1;
}

/* install prompt banner */
.install-prompt{
  position: fixed;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%) translateY(12px);
  display: none;
  align-items: center;
  gap: 10px;
  max-width: calc(100vw - 28px);
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255,255,255,0.82);
  border: 1px solid rgba(15,23,42,0.08);
  box-shadow: 0 12px 34px rgba(0,0,0,0.16);
  backdrop-filter: blur(18px);
  z-index: 60;
}

.install-prompt.show{
  display: flex;
  transform: translateX(-50%) translateY(0);
}

.install-prompt .prompt-copy{
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.install-prompt .prompt-title{
  font-size: 13px;
  font-weight: 700;
  color: var(--text-main);
}

.install-prompt .prompt-subtitle{
  font-size: 12px;
  color: #475569;
}

.install-prompt .prompt-actions{
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.install-prompt button{
  border: 0;
  border-radius: 999px;
  padding: 9px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.install-prompt .install-action{
  background: var(--accent);
  color: #fff;
}

.install-prompt .dismiss-action{
  background: rgba(15,23,42,0.06);
  color: var(--text-main);
}

body.dark .install-prompt{
  background: rgba(15,23,42,0.82);
  border-color: rgba(148,163,184,0.22);
}

body.dark .install-prompt .prompt-subtitle,
body.dark .install-prompt .dismiss-action{
  color: #cbd5e1;
}

/* mobile first-time hint */
.mobile-hint{
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 78px;
  max-width: 86%;
  background: linear-gradient(180deg, rgba(0,0,0,0.6), rgba(0,0,0,0.45));
  color: #fff;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13px;
  text-align: center;
  z-index: 40;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  opacity: 0;
  transition: opacity 220ms ease, transform 220ms ease;
  pointer-events: auto;
}
.mobile-hint.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mobile-hint .hint-close{margin-left:8px;background:transparent;border:0;color:#fff;font-weight:600}

.copy-item{
  cursor:pointer;
  border:1px solid rgba(15,23,42,0.06);
  border-radius:8px;
  padding:6px 8px;
  background:#f8fafc;
  color:var(--text-main);
  text-align:left;
  font-size:12.5px;
}

.copy-item.copied{
  background:rgba(56,189,248,0.18);
}



.extras-row{
  margin-top:10px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
}

/* QR removed - using vCard button only */

.vcard-btn{
  border:1px solid var(--accent-opaque);
  border-radius:10px;
  padding:8px 10px;
  font-size:12px;
  color:var(--text-main);
  background: rgba(6,182,212,0.08);
  cursor:pointer;
}

.social-link{
  display:inline-block;
  border:1px solid var(--accent-opaque);
  border-radius:10px;
  padding:8px 10px;
  font-size:12px;
  color:var(--text-main);
  background:transparent;
  text-decoration:none;
}

.theme-toggle{display:none}

<script>
const card = document.getElementById("card");

/* Pointer-controlled rotation (no inertia): click/touch and drag to rotate; stops on release */
let isPointerDown = false;
let startX = 0, startY = 0;
let baseRotX = 0, baseRotY = 0;
let pointerDownTime = 0;
let movedDuringPointer = false;
let pointerStartedInsideCard = false;
let lastTapTime = 0;
// track current rotation so inline transforms can be combined with flip
let currentRotX = 0, currentRotY = 0;

function flipCard(){
  card.classList.toggle('is-flipped');
  updateCardTransform();
  hideHint(true);
}

function updateCardTransform(){
  const flipPrefix = card.classList.contains('is-flipped') ? 'rotateY(180deg) ' : '';
  card.style.transform = `${flipPrefix}rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
}

function onPointerDown(e){
  isPointerDown = true;
  const p = e.touches ? e.touches[0] : e;
  startX = p.clientX; startY = p.clientY;
  movedDuringPointer = false;
  pointerStartedInsideCard = card.contains(e.target);
  pointerDownTime = Date.now();
  // use current rotation as base so rotations are preserved
  baseRotX = currentRotX; baseRotY = currentRotY;
}

function onPointerMove(e){
  if(!isPointerDown) return;
  const p = e.touches ? e.touches[0] : e;
  const dx = p.clientX - startX;
  const dy = p.clientY - startY;
  if(Math.hypot(dx, dy) > 6) movedDuringPointer = true;
  const rotY = baseRotY + dx * 0.15; // sensitivity
  const rotX = baseRotX - dy * 0.12;
  currentRotX = rotX; currentRotY = rotY;
  updateCardTransform();
}

function onPointerUp(){
  const duration = Date.now() - pointerDownTime;
  // Double-click/double-tap anywhere on card flips it. Dragging remains unaffected.
  if(pointerStartedInsideCard && !movedDuringPointer && duration < 260){
    const now = Date.now();
    if(now - lastTapTime < 320){
      flipCard();
      lastTapTime = 0;
    }else{
      lastTapTime = now;
    }
  }
  isPointerDown = false;
}

// mouse
document.addEventListener('mousedown', onPointerDown);
document.addEventListener('mousemove', onPointerMove);
document.addEventListener('mouseup', onPointerUp);
// touch
document.addEventListener('touchstart', onPointerDown, {passive:true});
document.addEventListener('touchmove', onPointerMove, {passive:true});
document.addEventListener('touchend', onPointerUp);

function resetCard(){
  currentRotX = 0; currentRotY = 0;
  card.classList.remove('is-flipped');
  updateCardTransform();
  try{ navigator.vibrate && navigator.vibrate(10); }catch(e){}
}
// (Reset button removed from UI; keyboard still calls resetCard)

// Keyboard accessibility: Space/Enter flip, arrows rotate, R/Escape reset
document.addEventListener('keydown', (ev)=>{
  const key = ev.key;
  if(key === ' ' || key === 'Spacebar' || key === 'Enter'){
    ev.preventDefault();
    flipCard();
    try{ navigator.vibrate && navigator.vibrate(10); }catch(e){}
    return;
  }
  if(key === 'Escape' || key.toLowerCase() === 'r'){
    resetCard();
    return;
  }
  const step = 6; // degrees per arrow
  if(key === 'ArrowLeft'){
    currentRotY -= step; updateCardTransform();
  }else if(key === 'ArrowRight'){
    currentRotY += step; updateCardTransform();
  }else if(key === 'ArrowUp'){
    currentRotX = Math.max(-90, currentRotX - step); updateCardTransform();
  }else if(key === 'ArrowDown'){
    currentRotX = Math.min(90, currentRotX + step); updateCardTransform();
  }
});

// Rotate handle (touch-friendly): drag the handle to rotate the card
let isHandleDown = false;
let handleStartX = 0, handleStartY = 0;

function onHandleDown(e){
  e.stopPropagation();
  e.preventDefault && e.preventDefault();
  isHandleDown = true;
  const p = e.touches ? e.touches[0] : e;
  handleStartX = p.clientX; handleStartY = p.clientY;
  baseRotX = currentRotX; baseRotY = currentRotY;
}

function onHandleMove(e){
  if(!isHandleDown) return;
  e.stopPropagation();
  const p = e.touches ? e.touches[0] : e;
  const dx = p.clientX - handleStartX;
  const dy = p.clientY - handleStartY;
  currentRotY = baseRotY + dx * 0.18;
  currentRotX = baseRotX - dy * 0.14;
  updateCardTransform();
}

function onHandleUp(e){
  isHandleDown = false;
}

document.addEventListener('mousemove', onHandleMove);
document.addEventListener('mouseup', onHandleUp);

// Mobile hint: show once for touch devices, persist dismissal in localStorage
const mobileHint = document.getElementById('mobileHint');
const hintClose = document.getElementById('hintClose');
function hideHint(persist=true){
  if(!mobileHint) return;
  mobileHint.classList.remove('show');
  if(persist) try{ localStorage.setItem('cardHintSeen','1') }catch(e){}
}

function showHintIfNeeded(){
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if(!isTouch || !mobileHint) return;
  const seen = (()=>{try{return localStorage.getItem('cardHintSeen')}catch(e){return null}})();
  if(seen) return;
  // show after tiny delay so UI is ready
  setTimeout(()=> mobileHint.classList.add('show'), 600);
  // auto-hide after 6s
  setTimeout(()=> hideHint(false), 6000);
}

hintClose && hintClose.addEventListener('click', ()=> hideHint(true));
showHintIfNeeded();

// Dark mode removed — UI is now single-theme

// Tap-to-copy for contact rows
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject)=>{
    try{
      const t = document.createElement('textarea');
      t.value = text;
      document.body.appendChild(t);
      t.select();
      document.execCommand('copy');
      document.body.removeChild(t);
      resolve();
    }catch(e){ reject(e); }
  });
}

document.querySelectorAll('.copy-item').forEach((el)=>{
  el.addEventListener('click', async ()=>{
    const value = el.getAttribute('data-copy') || '';
    try{
      await copyText(value);
      const old = el.textContent;
      el.classList.add('copied');
      el.textContent = 'Copied';
      setTimeout(()=>{
        el.classList.remove('copied');
        el.textContent = old;
      }, 900);
    }catch(e){
      console.warn('Copy failed', e);
    }
  });
});


// QR code + vCard download
// QR generation removed

const vcardBtn = document.getElementById('downloadVcard');
vcardBtn && vcardBtn.addEventListener('click', ()=>{
  const vcf = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'FN:Garvit Chawla',
    'TITLE:Software Developer',
    'EMAIL;TYPE=INTERNET:garvitchawla.office@gmail.com',
    'TEL;TYPE=CELL:+919660665666',
    
    'URL:https://linkedin.com/in/garvit-chawla',
    'END:VCARD'
  ].join('\n');

  const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'garvit-chawla.vcf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});


// initialize SVG stroke animation for draw/erase loop
(function initSignatureAnimation(){
  const strokes = document.querySelectorAll('.signature-stroke');
  strokes.forEach(p=>{
    try{
      const len = p.getTotalLength();
      p.style.setProperty('--pathLen', len + 'px');
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
      // trigger layout then start animation
      void p.getBoundingClientRect();
      p.classList.add('animate');
    }catch(e){console.warn('SVG path length unavailable', e)}
  });
})();

// --- PWA: Service Worker registration + install prompt handling ---
let deferredPrompt = null;
const installPrompt = document.getElementById('installPrompt');
const installBtn = document.getElementById('installBtn');
const dismissInstall = document.getElementById('dismissInstall');

// Register service worker if supported
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('service-worker.js')
    .then(reg=>console.log('ServiceWorker registered', reg.scope))
    .catch(err=>console.warn('SW register failed', err));
}

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e; // save for later
  // show the install banner
  if(installPrompt){
    installPrompt.classList.add('show');
  }
});

installBtn && installBtn.addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const choice = await deferredPrompt.userChoice;
  if(choice && choice.outcome){
    console.log('User choice:', choice.outcome);
  }
  if(installPrompt){
    installPrompt.classList.remove('show');
  }
  deferredPrompt = null;
});

dismissInstall && dismissInstall.addEventListener('click', ()=>{
  if(installPrompt){
    installPrompt.classList.remove('show');
  }
});

// optional: show offline notice when navigator goes offline
window.addEventListener('offline', ()=>{
  console.log('Offline mode');
});
</script>
</script>
